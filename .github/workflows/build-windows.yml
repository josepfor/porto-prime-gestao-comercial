name: Gerar Porto Prime Windows EXE

# Build acionado após validação da busca integrada de produtos.

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder-update.yml'
      - 'build/**'
      - 'electron-main.cjs'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: porto-prime-windows
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Descobrir cache do npm
        id: npm-cache-dir
        shell: pwsh
        run: |
          "dir=$(npm config get cache)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restaurar cache do npm
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: porto-prime-npm-node22-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            porto-prime-npm-node22-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe e testes criticos
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem src -Filter *.js | ForEach-Object { node --check $_.FullName }
          node --check src/trial-license.js
          node --check electron-main.cjs
          node --check public/app.js
          node scripts/check-critical-functions.cjs
          node scripts/check-trial-license.cjs
          node scripts/check-products.mjs
          node scripts/check-quote-search.cjs
          node scripts/check-pdv-keyboard.cjs
          node scripts/check-management-report.mjs
          node scripts/check-stability-420.mjs
          node scripts/check-server-integrity.cjs
          node scripts/check-sale-idempotency.cjs
          node scripts/check-stock-intelligence.mjs
          node scripts/check-seller-performance.mjs
          node scripts/check-data-directory.cjs
          node scripts/check-password-recovery.cjs

      - name: Gerar EXE portatil e instalador
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Gerar atualizador seguro
        run: npx electron-builder --win nsis --x64 --config electron-builder-update.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Conferir EXEs e tamanhos
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe"
          )

          foreach ($file in $expected) {
            if (-not (Test-Path $file)) {
              throw "Arquivo esperado nao foi gerado: $file"
            }

            $sizeMB = [math]::Round((Get-Item $file).Length / 1MB, 2)
            if ((Get-Item $file).Length -lt 1MB) {
              throw "Arquivo suspeito ou vazio: $file"
            }

            Write-Host "OK: $file - $sizeMB MB"
          }

      - name: Criar pacote ZIP e hashes SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageDir = "dist/PortoPrime-$version-Windows"
          $zip = "dist/PortoPrime-$version-Windows.zip"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $files = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe"
          )

          foreach ($file in $files) {
            Copy-Item $file $packageDir -Force
          }

          Compress-Archive -Path "$packageDir/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -lt 1MB) {
            throw "Pacote ZIP suspeito ou vazio: $zip"
          }

          $allFiles = @($files + $zip)
          $lines = foreach ($file in $allFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"
          Write-Host "OK: pacote ZIP e hashes SHA-256 gerados."

      # Download separado do instalador: evita obrigar o usuário a baixar
      # o ZIP agregado de ~574 MB só para obter o instalador.
      - name: Disponibilizar instalador separado
        uses: actions/upload-artifact@v4
        with:
          name: PortoPrime-Setup-Windows
          path: |
            dist/PortoPrime-Setup-*-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Disponibilizar pacote completo
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PortoPrime-4.4.9-Windows
          path: |
            dist/PortoPrime-Portable-*-x64.exe
            dist/PortoPrime-Setup-*-x64.exe
            dist/PortoPrime-Atualizacao-*-x64.exe
            dist/PortoPrime-*-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publicar Release do Porto Prime
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @(
            "dist/PortoPrime-Portable-$version-x64.exe",
            "dist/PortoPrime-Setup-$version-x64.exe",
            "dist/PortoPrime-Atualizacao-$version-x64.exe",
            "dist/PortoPrime-$version-Windows.zip",
            "dist/SHA256SUMS.txt"
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag ja existe. Atualizando os arquivos..."
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            Write-Host "Criando Release $tag..."
            gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Porto Prime $version" --notes "Versao $version do Porto Prime para Windows. Inclui Portable, Instalador, Atualizador seguro, ZIP e SHA256SUMS.txt."
          }

      - name: Resumo da compilacao
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host ""
          Write-Host "========================================"
          Write-Host "PORTO PRIME $version - BUILD CONCLUIDO"
          Write-Host "========================================"
          Write-Host "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version"
